<!doctype html>
<html lang="fr-CI">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.png" type="image/x-icon" />
    <link
      rel="icon"
      href="favicon-dark.png"
      type="image/png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>WashPilot CI — Gestion de station de lavage</title>
    <meta name="title" content="WashPilot CI — Gestion de station de lavage" />
    <meta
      name="description"
      content="WashPilot CI aide les stations de lavage à suivre leurs lavages, leurs encaissements et leur équipe."
    />

    <!-- Canonical (points to the main template URL) -->
    <link rel="canonical" href="https://shadcnstore.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WashPilot CI" />
    <meta property="og:title" content="WashPilot CI — Gestion de station de lavage" />
    <meta
      property="og:description"
      content="WashPilot CI aide les stations de lavage à suivre leurs lavages, leurs encaissements et leur équipe."
    />
    <meta property="og:url" content="https://washpilot.ci/" />
    <!-- Use an absolute URL so scrapers can fetch the image reliably -->
    <meta property="og:image" content="/og-image.png" />
    <meta
      property="og:image:alt"
      content="Aperçu de WashPilot CI"
    />
    <!-- Optional: dimensions (leave generic if not exact) -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WashPilot CI — Gestion de station de lavage" />
    <meta
      name="twitter:description"
      content="WashPilot CI aide les stations de lavage à suivre leurs lavages, leurs encaissements et leur équipe."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Aperçu de WashPilot CI"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
